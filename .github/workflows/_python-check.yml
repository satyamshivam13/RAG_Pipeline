name: reusable-python-check

on:
  workflow_call:
    inputs:
      check_name:
        description: "Human-readable check name used in summaries and artifacts."
        required: true
        type: string
      command:
        description: "Command to execute after dependency installation."
        required: true
        type: string
      python_version:
        description: "Python version for the check runner."
        required: false
        default: "3.11"
        type: string
      install_command:
        description: "Dependency installation command. Keep narrow for faster lint/security jobs."
        required: false
        default: "python -m pip install -r requirements-dev.txt"
        type: string
      artifact_path:
        description: "Optional report path to upload on success or failure."
        required: false
        default: ""
        type: string

jobs:
  run:
    name: ${{ inputs.check_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
            .flake8

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          ${{ inputs.install_command }}

      - name: Run ${{ inputs.check_name }}
        shell: bash
        run: ${{ inputs.command }}

      - name: Upload report artifact
        if: always() && inputs.artifact_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.check_name }}-report
          path: ${{ inputs.artifact_path }}
          if-no-files-found: ignore

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ inputs.check_name }}"
            echo ""
            echo "- Python: ${{ inputs.python_version }}"
            echo "- Install: \`${{ inputs.install_command }}\`"
            echo "- Command: \`${{ inputs.command }}\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
